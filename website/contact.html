<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Sehy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sehy_web/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="container" style="max-width:420px;">
    <a class="back-link" href="/sehy_web/profile.html">&larr; Profile</a>
    <div class="card">
      <div class="top-title">Contact Us</div>
      <form id="contact-form">
        <div class="form-field">
          <label>What is this about?</label>
          <select id="query-type" required>
            <option value="" disabled selected>Select one</option>
            <option>General Inquiry</option>
            <option>Report an Issue</option>
            <option>Service/Category Listing Request</option>
            <option>Advertise With Us</option>
            <option>Area Listing</option>
            <option>Feedback & Suggestions</option>
            <option>Account / Login Issue</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-field">
          <label>Area (optional)</label>
          <select id="area">
            <option value="">-</option>
          </select>
        </div>
        <div class="form-field">
          <label>Tell us more</label>
          <textarea id="description" rows="5" required></textarea>
        </div>
        <div class="error-text" id="error" style="display:none;"></div>
        <button class="btn" type="submit" style="width:100%;margin-top:8px;" id="submit-btn">Submit</button>
      </form>
    </div>
  </div>

  <script src="/sehy_web/js/api.js"></script>
  <script src="/sehy_web/js/analytics.js"></script>
  <script src="/sehy_web/js/common.js"></script>
  <script src="/sehy_web/js/header.js"></script>
  <script>
    if (!requireLogin('/sehy_web/contact.html')) {
      throw new Error('redirecting to login');
    }

    api.get('/areas/list.php').then(({ areas }) => {
      const select = document.getElementById('area');
      select.innerHTML = '<option value="">-</option>' +
        areas.map((c) => `<option>${c.name}</option>`).join('');
    });

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      try {
        await api.post('/contact/create.php', {
          query_type: document.getElementById('query-type').value,
          area: document.getElementById('area').value,
          description: document.getElementById('description').value.trim(),
        });
        alert("Thanks! We'll get back to you soon.");
        window.location.href = '/sehy_web/profile.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Staff Portal - Sehy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans" style="font-family: 'Tenor Sans', sans-serif;">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-indigo-900 text-white px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap gap-2 justify-between items-center shadow-md">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-8 h-8 bg-indigo-500 rounded flex items-center justify-center font-bold shrink-0">GL</div>
      <h1 class="text-base sm:text-xl font-bold tracking-wide truncate" id="category-heading">SERVICE STAFF PORTAL</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden sm:inline text-sm bg-indigo-800 py-1 px-3 rounded-full border border-indigo-600">Logged in: <strong id="staff-name">&nbsp;</strong></span>
      <button id="signout-btn" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded transition shrink-0">Logout</button>
    </div>
  </header>

  <div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-gray-200 md:min-h-screen p-3 md:p-4">
      <nav id="nav-tabs" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-1 md:pb-0"></nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 min-w-0 p-4 md:p-8 space-y-6 md:space-y-8" id="content">
      <div class="text-gray-500">Loading...</div>
    </main>
  </div>

  <script src="/sehy_web/js/api.js"></script>
  <script src="/sehy_web/js/common.js"></script>
  <script src="/sehy_web/js/staff-dashboard.js"></script>
</body>
</html>

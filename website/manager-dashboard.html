<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mall Manager Dashboard - GLML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans" style="font-family: 'Tenor Sans', sans-serif;">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-lg border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <span class="w-8 h-8 bg-amber-500 text-slate-950 rounded flex items-center justify-center font-bold">GL</span>
      <h1 class="text-xl font-bold tracking-wide" id="mall-heading">MALL MANAGEMENT</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span class="text-xs bg-slate-800 py-1.5 px-3 rounded-full border border-slate-700 text-slate-300">Role: <strong>Mall Manager</strong></span>
      <button id="signout-btn" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-white transition">Sign Out</button>
    </div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white min-h-screen p-4 border-r border-slate-200">
      <nav class="space-y-1">
        <a href="#analytics-section" class="block px-3 py-2 bg-amber-50 text-amber-900 font-semibold rounded-lg">&#128202; Analytics</a>
        <a href="#mall-profile-section" class="block px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">&#127970; Mall Profile</a>
        <a href="#stores-section" class="block px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">&#127978; Stores</a>
        <a href="#ads-section" class="block px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">&#128444;&#65039; Hero Banner Ads</a>
        <a href="/gmls_web/profile.html" class="block px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">&#128100; Back to Profile</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-8 space-y-8" id="content">
      <div class="text-slate-500">Loading...</div>
    </main>
  </div>

  <script src="/gmls_web/js/api.js"></script>
  <script src="/gmls_web/js/common.js"></script>
  <script src="/gmls_web/js/payments.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/gmls_web/js/manager-dashboard.js"></script>
</body>
</html>

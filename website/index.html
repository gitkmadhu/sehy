<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLML - Malls & Stores</title>
  <link rel="stylesheet" href="/gmls_web/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    .swiper-button-next, .swiper-button-prev {
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }
    .swiper-button-next::after, .swiper-button-prev::after {
      font-size: 15px;
      font-weight: bold;
    }
    .swiper-pagination-bullet-active {
      background: #f59e0b !important;
      width: 22px;
      border-radius: 4px;
    }
    .city-scroll::-webkit-scrollbar { width: 6px; }
    .city-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .city-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .city-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="site-header"></div>

  <section class="max-w-5xl mx-auto px-4 py-6">
    <div id="hero-carousel-wrap"></div>
  </section>

  <section class="max-w-5xl mx-auto px-4 pb-10">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-bold text-gray-900">Explore Cities</h3>
    </div>
    <input
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm mb-5 outline-none focus:border-amber-400 transition"
      type="text" id="city-search" placeholder="Search cities..." />
    <div id="city-grid-wrap"></div>
  </section>

  <script src="/gmls_web/js/api.js"></script>
  <script src="/gmls_web/js/analytics.js"></script>
  <script src="/gmls_web/js/common.js"></script>
  <script src="/gmls_web/js/header.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/gmls_web/js/home.js"></script>
</body>
</html>

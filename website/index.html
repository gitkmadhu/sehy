<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sehy - Categories & Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sehy_web/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    .swiper-button-next, .swiper-button-prev {
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }
    .swiper-button-next::after, .swiper-button-prev::after {
      font-size: 15px;
      font-weight: bold;
    }
    .swiper-pagination-bullet-active {
      background: #f59e0b !important;
      width: 22px;
      border-radius: 4px;
    }
    .area-scroll::-webkit-scrollbar { width: 6px; }
    .area-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .area-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .area-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Neomorphic card/card-row/avatar styles now live in style.css (shared
       with category.html). Only the home page's own bits stay here. */
    /* Neomorphic tab bar: raised pills, the current section shown pressed in. */
    .neo-tabs {
      /* Top/left padding clears the pill's own light shadow (offset -6px,
         blur 12px — see .neo-tab), same reasoning as .neo-card-row below. */
      display: flex; gap: 14px; overflow-x: auto; padding: 18px 10px 18px 18px; margin: 0 -10px 0 -18px;
      scrollbar-width: none;
    }
    .neo-tabs::-webkit-scrollbar { display: none; }
    /* The tab bar sticks to the top of the viewport while the page scrolls. */
    #home-tabs-wrap { position: sticky; top: 0; z-index: 60; background: var(--neo-bg); transition: box-shadow .2s ease; }
    #home-tabs-wrap.stuck { box-shadow: 0 8px 16px -8px var(--neo-dark); }
    .neo-tab {
      flex: 0 0 auto; border: none; background: var(--neo-bg); color: #4b5563;
      font: inherit; font-size: 14px; font-weight: 400; padding: 10px 22px; border-radius: 9999px;
      box-shadow: 6px 6px 12px var(--neo-dark), -6px -6px 12px var(--neo-light);
      transition: box-shadow .2s ease, color .2s ease;
    }
    .neo-tab-home { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; }
    .neo-tab:hover { color: #43648d; }
    .neo-tab.active {
      color: #43648d; font-weight: 800; -webkit-text-stroke: 0.6px #43648d;
      box-shadow: inset 4px 4px 9px var(--neo-dark), inset -4px -4px 9px var(--neo-light);
    }
    /* The active category's heading is highlighted to match its tab. */
    .home-section h3 { display: inline-block; border-bottom: 3px solid transparent; transition: color .2s ease, border-color .2s ease; }
    .home-section.active h3 { color: #43648d; font-weight: 800; -webkit-text-stroke: 0.6px #43648d; border-bottom-color: #43648d; }
    /* Search box: bluish-grey border while it has focus. */
    #home-search { border-color: #e5e7eb; }
    #home-search:focus { border-color: #7d8fb0; box-shadow: 0 0 0 3px rgba(125, 143, 176, 0.25); }
    .view-all-link { color: rgb(31 86 224); }
    .home-section { scroll-margin-top: 84px; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="neo-page">
  <div id="site-header"></div>

  <section class="max-w-5xl mx-auto px-4 py-6">
    <div id="hero-carousel-wrap"></div>
  </section>

  <div id="home-tabs-wrap" hidden>
    <div class="max-w-5xl mx-auto px-4">
      <div id="home-tabs" class="neo-tabs" role="tablist" aria-label="Sections"></div>
    </div>
  </div>

  <section class="max-w-5xl mx-auto px-4 pb-10">
    <div class="flex justify-end mb-2">
      <a href="/sehy_web/admin.html" id="dashboard-link" class="text-sm font-semibold text-indigo-700 hover:underline whitespace-nowrap" hidden>Dashboard &rarr;</a>
    </div>
    <input
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm mb-2 outline-none transition"
      type="text" id="home-search" placeholder="Search units and shops..." />
  </section>

  <div id="home-sections-wrap"></div>

  <script src="/sehy_web/js/api.js"></script>
  <script src="/sehy_web/js/analytics.js"></script>
  <script src="/sehy_web/js/common.js"></script>
  <script src="/sehy_web/js/header.js"></script>
  <script src="/sehy_web/js/card-row.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/sehy_web/js/home.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Sehy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sehy_web/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="container" style="max-width:420px;">
    <div id="content"><div class="loading">Loading...</div></div>
  </div>

  <script src="/sehy_web/js/api.js"></script>
  <script src="/sehy_web/js/analytics.js"></script>
  <script src="/sehy_web/js/common.js"></script>
  <script src="/sehy_web/js/header.js"></script>
  <script>
    async function init() {
      const content = document.getElementById('content');
      const token = authToken();
      if (!token) {
        content.innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="font-size:40px;">&#128100;</div>
            <p>Sign in to manage your profile</p>
            <a class="btn" href="/sehy_web/login.html">Sign in</a>
          </div>`;
        return;
      }
      try {
        const { user } = await api.get('/auth/me.php');
        setCurrentUser(user);
        const initial = (user.name || '?').charAt(0).toUpperCase();

        if (user.role === 'admin' || user.role === 'super_admin') {
          renderAdminProfile(user, initial);
          return;
        }

        let rows = '';
        if (user.role === 'service_owner') {
          rows += `<a class="list-row" href="/sehy_web/my-service.html">
                     <div class="avatar">&#127978;</div>
                     <div class="info"><div class="name">My Service & Offers</div></div>
                     <div class="chevron">&rsaquo;</div>
                   </a>`;
        }
        if (user.role === 'service_staff') {
          rows += `<a class="list-row" href="/sehy_web/staff-dashboard.html">
                     <div class="avatar">&#127978;</div>
                     <div class="info"><div class="name">Service Staff Portal</div></div>
                     <div class="chevron">&rsaquo;</div>
                   </a>`;
        }
        if (user.role === 'category_manager') {
          rows += `<a class="list-row" href="/sehy_web/manager-dashboard.html">
                     <div class="avatar">&#127970;</div>
                     <div class="info"><div class="name">Category Manager Dashboard</div></div>
                     <div class="chevron">&rsaquo;</div>
                   </a>`;
        }
        if (user.role === 'category_staff') {
          rows += `<a class="list-row" href="/sehy_web/my-category-ads.html">
                     <div class="avatar">&#127970;</div>
                     <div class="info"><div class="name">My Category Ads</div></div>
                     <div class="chevron">&rsaquo;</div>
                   </a>`;
        }
        if (user.role === 'admin' || user.role === 'super_admin') {
          rows += `<a class="list-row" href="/sehy_web/admin.html">
                     <div class="avatar">&#128737;</div>
                     <div class="info"><div class="name">Admin Dashboard</div></div>
                     <div class="chevron">&rsaquo;</div>
                   </a>`;
        }
        rows += `<a class="list-row" href="/sehy_web/contact.html">
                   <div class="avatar">&#128222;</div>
                   <div class="info"><div class="name">Contact Us</div></div>
                   <div class="chevron">&rsaquo;</div>
                 </a>`;
        content.innerHTML = `
          <div class="card" style="text-align:center;">
            <div class="avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px;">${escapeHtml(initial)}</div>
            <div class="top-title" style="margin-bottom:0;">${escapeHtml(user.name)}</div>
            <div class="sub" style="color:var(--text-muted);">${escapeHtml(user.email)}</div>
          </div>
          ${rows}
          <button class="btn danger" style="width:100%;margin-top:16px;" id="logout-btn">Log out</button>
        `;
        document.getElementById('logout-btn').addEventListener('click', () => {
          logout();
          window.location.href = '/sehy_web/index.html';
        });
      } catch (e) {
        logout();
        content.innerHTML = `<div class="empty-state">${e.message}</div>`;
      }
    }

    function renderAdminProfile(user, initial) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px;">${escapeHtml(initial)}</div>
          <div class="top-title" style="margin-bottom:0;">${escapeHtml(user.name)}</div>
        </div>
        <div class="card">
          <div class="form-field"><label>Name</label><div>${escapeHtml(user.name)}</div></div>
          <div class="form-field"><label>Mobile</label><div>${escapeHtml(user.phone || '—')}</div></div>
          <div class="form-field"><label>Email</label><div>${escapeHtml(user.email)}</div></div>
        </div>
        <a class="btn" style="width:100%;display:block;text-align:center;" href="/sehy_web/admin.html">Dashboard</a>
        <button class="btn outline" style="width:100%;margin-top:8px;" id="reset-password-btn">Reset Password</button>
        <div class="card" id="reset-password-form" style="display:none;margin-top:8px;">
          <div class="form-field"><label>Current password</label><input type="password" id="rp-current" /></div>
          <div class="form-field"><label>New password</label><input type="password" id="rp-new" /></div>
          <div class="form-field"><label>Confirm new password</label><input type="password" id="rp-confirm" /></div>
          <div class="error-text" id="rp-error" style="display:none;"></div>
          <div style="display:flex;gap:8px;">
            <button class="btn outline" id="rp-cancel" style="flex:1;">Cancel</button>
            <button class="btn" id="rp-save" style="flex:1;">Save</button>
          </div>
        </div>
        <button class="btn danger" style="width:100%;margin-top:8px;" id="logout-btn">Log out</button>
      `;

      document.getElementById('logout-btn').addEventListener('click', () => {
        logout();
        window.location.href = '/sehy_web/index.html';
      });

      const form = document.getElementById('reset-password-form');
      document.getElementById('reset-password-btn').addEventListener('click', () => {
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });
      document.getElementById('rp-cancel').addEventListener('click', () => {
        form.style.display = 'none';
        document.getElementById('rp-current').value = '';
        document.getElementById('rp-new').value = '';
        document.getElementById('rp-confirm').value = '';
        document.getElementById('rp-error').style.display = 'none';
      });
      document.getElementById('rp-save').addEventListener('click', async () => {
        const current = document.getElementById('rp-current').value;
        const next = document.getElementById('rp-new').value;
        const confirm = document.getElementById('rp-confirm').value;
        const errEl = document.getElementById('rp-error');
        errEl.style.display = 'none';
        if (next !== confirm) {
          errEl.textContent = 'New password and confirmation do not match';
          errEl.style.display = 'block';
          return;
        }
        const btn = document.getElementById('rp-save');
        btn.disabled = true;
        try {
          await api.post('/auth/change_password.php', { current_password: current, new_password: next });
          alert('Password changed successfully.');
          document.getElementById('rp-cancel').click();
        } catch (e) {
          errEl.textContent = e.message;
          errEl.style.display = 'block';
        } finally {
          btn.disabled = false;
        }
      });
    }

    init();
  </script>
</body>
</html>
